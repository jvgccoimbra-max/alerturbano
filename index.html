<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertaUrbano - Registro de Ocorrências</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>AlertaUrbano</h1>
        <p>Sistema Comunitário de Registro de Ocorrências</p>
    </header>

    <main>
        <section class="card">
            <h2>Nova Ocorrência</h2>
            <form id="ocorrencia-form">
                <label for="descricao">Descrição do Problema:</label>
                <textarea id="descricao" rows="4" placeholder="Ex: Buraco grande na via pública..." required></textarea>

                <button type="button" id="btn-geo">Obter Geolocalização GPS</button>
                <p id="status-geo">Localização não capturada.</p>

                <label for="foto">Evidência Fotográfica:</label>
                <input type="file" id="foto" accept="image/*" capture="environment">

                <button type="submit">Enviar Ocorrência</button>
            </form>
        </section>

        <section class="card">
            <h2>Ocorrências Registradas</h2>
            <div id="status-conexao" class="online">Status: Conectado</div>
            <ul id="lista-ocorrencias">
                <!-- Lista dinâmica preenchida pelo app.js -->
            </ul>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
